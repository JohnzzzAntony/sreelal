# nginx site config. Certbot rewrites this to add the TLS block and the
# HTTP-to-HTTPS redirect when you run `certbot --nginx`.

server {
    listen 80;
    server_name iamsreelalck.com www.iamsreelalck.com;

    # Uploaded images can be large; the app caps them at 5 MB by default.
    client_max_body_size 8M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # TRUST_PROXY=1 reads these. Without X-Forwarded-Proto the app cannot
        # tell the request arrived over HTTPS, refuses to issue its secure
        # session cookie, and admin login fails with a 403.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }
}
